name: ESFERA Visual Contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_esfera_visual_regression.py tests/test_esfera_discovery.py
