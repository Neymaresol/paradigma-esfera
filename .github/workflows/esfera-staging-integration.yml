name: ESFERA Staging Integration
on:
  pull_request:
    paths:
      - 'esfera_cell_persistence.py'
      - 'tests/test_esfera_cell_persistence.py'
      - '.github/workflows/esfera-staging-integration.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_esfera_cell_persistence.py -q
