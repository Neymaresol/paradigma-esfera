name: ESFERA Cell Tree Validation
on:
  pull_request:
    paths:
      - 'esfera_cells.py'
      - 'tests/test_esfera_cells.py'
      - '.github/workflows/cell-tree-validation.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_esfera_cells.py -q
