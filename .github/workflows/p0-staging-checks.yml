name: ESFERA P0 staging checks
on:
  push:
    branches:
      - dev/p0-esfera-commercial-readiness-20261027
  pull_request:
    paths:
      - 'app.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/p0-staging-checks.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ESFERA_AFFILIATE_PUBLISH_ENABLED: "false"
      ESFERA_AFFILIATE_PARTNER_VERIFIED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P0 regressions
        run: python -m pytest -q tests/test_p0_commercial_readiness_20261027.py
