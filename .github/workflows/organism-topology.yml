name: ESFERA Organism Topology
on:
  pull_request:
    paths:
      - 'esfera_organism.py'
      - 'tests/test_esfera_organism.py'
      - '.github/workflows/organism-topology.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_esfera_organism.py -q
