<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100719"><title>PARADIGMA ESFERA — Werozinha</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 25%,#50215c 0%,#1d0b2b 45%,#080710 100%);color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px}.wrap{max-width:520px;width:100%}.portrait{display:block;margin:0 auto 22px;max-height:55dvh;max-width:min(78vw,340px);width:auto;object-fit:contain;filter:drop-shadow(0 0 22px #ed3da766);animation:float 4s ease-in-out infinite}.brand{font-size:clamp(24px,6vw,38px);font-weight:800;letter-spacing:.09em}.subtitle{color:#f6b6dc;font-size:18px;margin:12px 0 20px}.track{height:6px;border-radius:10px;background:#ffffff26;overflow:hidden;margin:22px auto;width:min(320px,85%)}.track:before{content:"";display:block;width:38%;height:100%;background:linear-gradient(90deg,#ee3caa,#b18cff);animation:slide 1.5s ease-in-out infinite alternate}.hint{font-size:14px;color:#d5c4db;line-height:1.6}.retry{background:#ec3fa5;border:0;border-radius:28px;padding:13px 24px;color:white;font-weight:700;cursor:pointer;margin-top:16px}.retry[hidden]{display:none}@keyframes float{50%{transform:translateY(-10px)}}@keyframes slide{to{transform:translateX(165%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="wrap" aria-live="polite"><img class="portrait" alt="Werozinha oficial da ESFERA" src="https://raw.githubusercontent.com/Neymaresol/paradigma-esfera/main/assets/791ab1abd464309f599decbd26fffcbc99edc545e6b2a60a07d2126e4e8d8d19%20%281%29.png"><div class="brand">PARADIGMA ESFERA</div><div class="subtitle">A Werozinha está preparando seu universo de oportunidades 💗</div><div class="track" aria-hidden="true"></div><p id="status" class="hint">Conectando à ESFERA... Aguarde enquanto o sistema inicia.</p><button id="retry" class="retry" hidden>Tentar novamente</button></main>
<script>
(()=>{'use strict';const target='https://paradigma-esfera.onrender.com/';const status=document.getElementById('status'),retry=document.getElementById('retry');let tries=0,active=false;async function check(){if(active)return;active=true;tries++;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(target+'health',{mode:'cors',cache:'no-store',signal:controller.signal});if(response.ok){status.textContent='ESFERA pronta! Abrindo...';location.replace(target);return}}catch(e){}finally{clearTimeout(timer);active=false}if(tries>=15){status.textContent='O sistema está demorando mais que o esperado. Você pode tentar novamente.';retry.hidden=false;return}status.textContent='Inicializando a ESFERA... tentativa '+tries+' de 15';setTimeout(check,4000)}retry.addEventListener('click',()=>{tries=0;retry.hidden=true;check()});check()})();
</script></body></html>
